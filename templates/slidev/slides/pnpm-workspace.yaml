packages:
  - .

# @slidev/cli 52.20 系が markdown-it 15 を引き込むが、@comark/markdown-it は
# peer で ^14 しか対応しておらず slidev build が ERR_PACKAGE_PATH_NOT_EXPORTED で落ちる。
# 上流が 15 に追従したら削除する
overrides:
  markdown-it: ^14.3.0

# wrangler の依存が postinstall を必要とする (workerd はバイナリ取得)
allowBuilds:
  esbuild: true
  playwright-chromium: true
  sharp: true
  workerd: true
